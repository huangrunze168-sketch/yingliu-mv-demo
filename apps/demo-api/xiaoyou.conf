server {
    listen 80;
    server_name _;
    root /opt/xiaoyou/www;
    autoindex off;

    location /xiaoyou/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /xiaoyou/ping { return 200 "ok"; }

    location /collect/ {
        alias /var/www/collect/;
        dav_methods PUT;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;
        client_max_body_size 256k;
        autoindex on;
        autoindex_format json;
    }

    location /relay/ {
        proxy_pass http://127.0.0.1:8788/relay/;
        proxy_read_timeout 620s;
        proxy_set_header Host $host;
        client_max_body_size 2m;
    }

    location /yingliu-demo-api/ {
        proxy_pass http://127.0.0.1:8791/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering on;
        proxy_read_timeout 620s;
        proxy_send_timeout 620s;
        client_max_body_size 300m;
    }

    location /yingliu-demo-results/ {
        alias /var/lib/yingliu-demo/jobs/;
        add_header Cache-Control "private, max-age=3600";
        add_header X-Content-Type-Options "nosniff";
        types { video/mp4 mp4; }
        autoindex off;
    }
}
